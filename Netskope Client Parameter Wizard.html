<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Netskope Client Parameter Wizard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" rel="stylesheet" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f3f6fb;
        --surface: #ffffff;
        --surface-soft: #f7f9fc;
        --ink: #172033;
        --muted: #64748b;
        --line: #dbe3ef;
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-soft: #eaf1ff;
        --success: #16a34a;
        --warning: #f59e0b;
        --radius: 16px;
        --shadow: 0 8px 24px rgba(22, 34, 58, 0.06);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0 auto;
        width: min(100% - 32px, 1600px);
        padding: 28px 0 12px;
        color: var(--ink);
        background-color: var(--page-bg);
        background-image: radial-gradient(ellipse at top left, rgba(37, 99, 235, 0.08), transparent 34rem);
        background-repeat: no-repeat;
        background-attachment: fixed;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }

      h1 {
        text-align: center;
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.15;
        margin: 0.35rem 0 0.75rem;
        color: #111c33;
      }

      .text-center.small.mb-3 {
        margin-bottom: 1.5rem !important;
      }

      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
        text-underline-offset: 3px;
      }

      a:hover { color: var(--accent-strong); text-decoration: underline; }

      label.title {
        display: inline-block;
        font-weight: 700;
        font-size: 0.96rem;
        letter-spacing: -0.015em;
        color: #24314a;
        margin-bottom: 0.45rem;
      }

      .field-help {
        color: #7b8ba5;
        font-size: 0.82em;
        margin-left: 0.25rem;
        cursor: help;
        vertical-align: 0.05em;
      }

      .field-help:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 50%;
      }

      .text-xs {
        display: inline-block;
        margin-left: 0.25rem;
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 600;
      }

      .form-check-label {
      	font-size: 0.9rem;
        font-weight: 300;
        color: #334155;
        padding-top: 2px;
      }

      .row.g-3 > [class*="col-"] { min-width: 0; }
      
      .container {max-width: none;}

      .wizard-layout {
        display: block;
        width: min(100%, 900px);
        margin-inline: auto;
      }

      .wizard-fields {
        min-width: 0;
        width: 100%;
        max-width: 900px;
      }

      .wizard-layout > .container.mt-4.p-0 {
        width: 100%;
        max-width: none;
        min-width: 0;
        margin-top: 1.5rem !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }

      @media (min-width: 1490px) {
        form > .wizard-layout {
          display: grid;
          width: 100%;
          grid-template-columns: 900px minmax(440px, 1fr);
          align-items: start;
          column-gap: 1.25rem;
          margin-inline: 0;
        }

        .wizard-layout > .container.mt-4.p-0 {
          margin-top: 0 !important;
        }

        .wizard-layout .command-output {
          margin-top: 0;
          overflow-wrap: anywhere;
        }
      }

      .border.bg-light.p-3.h-100 {
        height: 100%;
        background: rgba(255, 255, 255, 0.94) !important;
        border: 1px solid var(--line) !important;
        border-radius: var(--radius);
        padding: 1.35rem !important;
        box-shadow: var(--shadow);
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .border.bg-light.p-3.h-100:hover {
        border-color: #c4d4ee !important;
        box-shadow: 0 12px 30px rgba(22, 34, 58, 0.09);
      }

      .form-control, .form-select, .input-group-text {
        min-height: 43px;
        border-color: #cfd9e7;
        border-radius: 10px;
        background-color: #fff;
        color: var(--ink);
        font-size: 0.92rem;
        box-shadow: none;
        transition: border-color 150ms ease, box-shadow 150ms ease, background-color 150ms ease;
      }

      .form-control, .form-select { padding: 0.62rem 0.8rem; }

      .form-select[size] {
        min-height: 132px;
        padding: 0.45rem;
      }

      .input-group-text {
        display: flex;
        align-items: center;
        padding: 0.6rem 0.8rem;
        background: var(--surface-soft);
        color: #526078;
      }

      .form-control:focus, .form-select:focus {
        border-color: #7aa5ff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
      }

      .form-control:disabled, .form-select:disabled {
        color: #7b879b;
        background-color: #f1f4f8;
        border-color: #e0e6ef;
        opacity: 1;
        cursor: not-allowed;
      }

      .small, small { color: var(--muted); }
      .text-muted { color: var(--muted) !important; }

      .form-check-input {
        width: 2.35em;
        height: 1.3em;
        margin-top: 0.1em;
        cursor: pointer;
        border-color: #b8c5d7;
      }

      .form-check-input:checked {
        background-color: var(--accent);
        border-color: var(--accent);
      }

      .form-check-input:focus {
        border-color: #7aa5ff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.13);
      }

      .pending-input {
        border-color: var(--warning) !important;
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.14) !important;
        background-color: #fffdf6;
      }

      #token-help-text, #enrollment-profile-help-text {
        display: block;
        margin-top: 0.65rem;
        padding-left: 0.1rem;
        font-size: 0.8rem;
        line-height: 1.55;
      }

      #token-help-text:empty,
      #enrollment-profile-help-text:empty {
        display: none !important;
        margin-bottom: 0;
      }

      /* Generated command panel */
      .command-output {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        background: #101827;
        color: #d9e7ff;
        padding: 1rem 1.25rem;
        position: relative;
        margin: 1.25rem 0 0.75rem;
        min-height: 84px;
        white-space: pre-line;
        border: 1px solid #25344d;
        border-radius: 14px;
        display: none;
        align-items: center;
        justify-content: flex-start;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
        overflow-wrap: anywhere;
      }

      .command-output code {
        color: inherit;
        font-size: 0.88rem;
        display: block;
        line-height: 1.7;
        padding: 0.25rem 0;
        width: 100%;
      }

      .output-placeholder {
        color: #aebbd0;
        font-style: normal;
      }

      .action-button {
        display: none;
        appearance: none;
        background: var(--accent);
        color: #fff;
        border: 1px solid var(--accent);
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.84rem;
        font-weight: 700;
        padding: 0.65rem 1rem;
        margin: 0.25rem 0 0 0.35rem;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
        transition: background 150ms ease, border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
      }

      .action-button:hover {
        background: var(--accent-strong);
        color: #fff;
        border-color: var(--accent-strong);
        text-decoration: none;
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(37, 99, 235, 0.22);
      }

      .action-button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.28);
        outline-offset: 2px;
      }

      .action-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }

      #downloadWinButton, #downloadMacButton {
        background: #fff;
        color: #24436f;
        border-color: #cbd8ea;
        box-shadow: none;
      }

      #downloadWinButton:hover, #downloadMacButton:hover {
        background: var(--accent-soft);
        color: var(--accent-strong);
        border-color: #9dbaf1;
      }
      
      .tooltip-inner {
        text-align: left;
        max-width: 320px;
        padding: 10px 14px;
        line-height: 1.5;
        font-size: 0.85rem;
      }
      
      .tooltip {
        --bs-tooltip-border-radius: 8px;
      }
      
      footer {
        padding: 0.8rem 1rem 0;
        font-size: 0.78rem;
      }

      @media (max-width: 767.98px) {
        body {
          width: min(100% - 24px, 1600px);
          padding-top: 18px;
        }

      .border.bg-light.p-3.h-100 {
          padding: 1rem !important;
        }

        .form-control, .form-select { max-width: 100% !important; }

        .text-end.mt-2.mb-4 {
          display: flex;
          flex-wrap: wrap;
          justify-content: flex-end;
          gap: 0.35rem;
        }

        .action-button { margin: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>
<body>
  <div class="container">
    <div class="text-center">
      <h1>Netskope Client Parameter Wizard</h1>
    </div>
  <form>
    <div class="text-center small mb-3">
      <a href="https://docs.netskope.com/en/netskope-client-deployment-options" target="_blank">
        Netskope Client Deployment Documentation
      </a>
    </div>
    <div class="container wizard-layout">
      <div class="wizard-fields">
  <div class="row g-3">
    <div class="col-md-6">
      <div class="border bg-light p-3 h-100">
        <div class="mb-2">
          <label for="tenant" class="title">Netskope Tenant
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Enter only the tenant hostname, without https:// or the domain suffix." aria-label="Help: Enter only the tenant hostname, without https:// or the domain suffix." tabindex="0"></i>
          </label>
          <input type="text" class="form-control" id="tenant" placeholder="Enter your tenant host..." style="max-width:260px" autofocus />
          <span class="small pt-1 ps-1 d-block">
            Enter only the bolded host, <b>tenant</b>.goskope.com
          </span>
      </div>
    <div>
      <label for="domain" class="title">Netskope Domain
          </label>
      <select class="form-select" id="domain" disabled style="max-width:200px" />
        <option value="goskope.com">goskope.com</option>
        <option value="au.goskope.com">au.goskope.com</option>
        <option value="de.goskope.com">de.goskope.com</option>
        <option value="eu.goskope.com">eu.goskope.com</option>
        <option value="govskope.ca">govskope.ca</option>
        <option value="govskope.us">govskope.us</option>
      </select>
  </div>
</div>
</div>
<div class="col-md-6">
  <div class="border bg-light p-3 h-100">
    <div class="mb-2">
      <label for="userMode" class="title">Netskope Client Enrollment Mode
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="UPN: Supports zero-touch user enrollment. Identity Provider: Requires users to authenticate explicitly during enrollment." tabindex="0"></i>
          </label>
      <select class="form-select" id="userMode" size="4" disabled style="max-width:340px"/>
        <option value="multi-upn">UPN Enrollment - Multi-User</option>
        <option value="single-upn">UPN Enrollment - Single User</option>
        <option value="multi-idp">Identity Provider Enrollment - Multi-User</option>
        <option value="single-idp">Identity Provider Enrollment - Single User</option>
      </select>
  </div>
</div>
</div>
</div>

<div class="row g-3 mt-2">
  <div class="col-md-6">
    <div class="border bg-light p-3 h-100">
      
      <div class="mb-2">
        <label for="token" class="title">Organization ID Token
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Enter the organization ID for your Netskope tenant, located under MDM Distribution (Deployment Resources for iOS)." tabindex="0"></i>
          </label>
        <input type="text" class="form-control" id="token" placeholder="Enter organization ID token..." disabled style="max-width:310px" />
      </div>
    <div class="mb-2">
      <label for="enrollauthtoken" class="title">Authentication Token
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="With Secure Enrollment enabled, any required authentication token must be enforced and unexpired before it can be used." tabindex="0"></i>
          </label>
      <input type="text" class="form-control" id="enrollauthtoken" placeholder="Enter authentication token..." disabled style="max-width:340px" />
    </div>
  <div>
    <label for="enrollencryptiontoken" class="title">Encryption Token
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="With Secure Configuration enabled, any required encryption token must be enforced and unexpired before it can be used." tabindex="0"></i>
          </label>
    <input type="text" class="form-control" id="enrollencryptiontoken" placeholder="Enter encryption token..." disabled style="max-width:340px" />
        <span id="token-help-text" class="small text-muted"></span>
  </div>
</div>
</div>
<div class="col-md-6">
  <div class="border bg-light p-3 h-100">
    <div class="mb-2">
      <label for="enforce-enroll-steering-profile-id" class="title">Enforce Enrollment Profile ID
          </label>
      <label class="text-xs">Optional</label>
      <input type="text" class="form-control" id="enforce-enroll-steering-profile-id" placeholder="Enter enrollment profile ID..." disabled="disabled" style="max-width:360px" />
    </div>
      <span id="enrollment-profile-help-text" class="small text-muted pb-1"></span>

  <div class="mb-2 mt-1">
    <label for="enforce-enroll-frequency" class="title">Enrollment Reminder Frequency
          </label>
    <label class="text-xs">Optional</label>
    <div class="input-group">
      <input type="number" value="5" min="1" step="1" class="form-control" id="enforce-enroll-frequency" placeholder="Minutes" disabled="disabled" style="max-width: 80px;" />
      <span class="input-group-text">minutes</span>
    </div>
</div>
<div>
  <label for="failClosed" class="title">Fail Close Override Action
            <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="This overrides the corresponding Fail Close setting in the Client Configuration profile configured in your Netskope tenant." tabindex="0"></i>
          </label>
  <label class="text-xs">Optional</label>
  <select class="form-select" id="failClosed" disabled style="max-width: 300px" />
    <option value="" disabled selected>--- Fail Close Override ---</option>
    <option value="disable">Disable Fail Close</option>
    <option value="no-npa">Fail Close SWG/CASB & Allow NPA</option>
    <option value="">Not Configured</option>
  </select>
</div>
</div>
</div>
</div>

<div class="row g-3 mt-2">
  <div class="col-md-6">
    <div class="border bg-light p-3 h-100">
      <span id="token-help-text" class="small text-muted"></span>
      <div class="mb-2">
        <label for="silent-Install" class="title">Hide Netskope Client Installer
          </label>
          <label class="text-xs">Optional</label>
          <div class="form-check form-switch">
            <input type="checkbox" class="form-check-input" id="silentInstall" disabled checked>
            <label class="form-check-label" for="silentInstall">Installer Hidden</label>
          </div>
        </div>
    <div class="mb-2">
       <label for="log-file-path" class="title">Installation Log File Path
          </label>
    <label class="text-xs">Optional</label>
    <input type="text" class="form-control" id="log-file-path" placeholder="e.g., C:\Temp\nscinstall.log" disabled style="max-width:350px" />
      </div>
  <div>
       <label for="auto-Update" class="title">Automatic Update Override
                   <i class="fa-solid fa-circle-info field-help" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="This overrides the corresponding Upgrade Client Automatically setting in the Client Configuration profile configured in your Netskope tenant." tabindex="0"></i>
          </label>
    <label class="text-xs">Optional</label>
	<select class="form-select" id="autoUpdate" disabled style="max-width: 300px" />
    <option value="" disabled selected>--- Automatic Update Override ---</option>
    <option value="off">Automatic Updates Disabled</option>
    <option value="on">Automatic Updates Allowed</option>
    <option value="">Not Configured</option>
  </select>
   </div>
</div>
</div>
<div class="col-md-6">
  <div class="border bg-light p-3 h-100">
  
  <div class="mb-2">
    <label for="device-tags" class="title">Device Tags
          </label>
    <label class="text-xs">Optional — Comma-separated</label>
    <input type="text" class="form-control" id="device-tags" placeholder="Enter device tags..." style="max-width:280px" />
  </div>
  


<div class="mb-2">
  <label for="prelogon-user" class="title">Private Access Prelogon User
          </label>
  <label class="text-xs">Optional</label>
  <div class="input-group">
    <input type="text" class="form-control" id="prelogon-user" placeholder="user-id" disabled style="max-width:165px" />
    <span class="input-group-text">@prelogon.netskope.com</span>
  </div>
  </div>
  
  <div>
    <label for="npa-vdi-mode" class="title">Private Access Multi-User VDI Mode
          </label>
      <label class="text-xs">Optional</label>
      <div class="form-check form-switch">
        <input type="checkbox" class="form-check-input" id="npavdimode" disabled />
        <label class="form-check-label" for="npavdimode">Disabled</label>
    </div>
</div>
  
</div>
</div>
</div>

      </div>

<div class="container mt-4 p-0">
  <div class="command-output">
    <code id="command" class="output-placeholder"></code>
  </div>
<div class="text-end mt-2 mb-4">
  <a class="action-button" id="downloadWinButton" href="#" aria-label="Download Windows Client">
    <i class="fa-brands fa-windows me-2" aria-hidden="true"></i>Windows Client
  </a>
<a class="action-button" id="downloadMacButton" href="#" aria-label="Download macOS Client">
  <i class="fa-brands fa-apple me-2" aria-hidden="true"></i>macOS Client
</a>
<button class="action-button" id="copyButton" type="button" disabled>
  <i class="fa-regular fa-copy me-2" aria-hidden="true"></i>Copy Output
</button>
</div>
</div>
</div>
</form>
</div>
<footer class="text-center mt-2 mb-3">
  <small class="text-muted">
    This tool is not affiliated with or supported by Netskope. Use at your own risk.
    </small>
</footer>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const tenantInput = document.getElementById('tenant');
  const allOtherFields = document.querySelectorAll('input:not(#tenant), select, button#copyButton');
  const cmdOutput = document.getElementById('command');
  const outputContainer = document.querySelector('.command-output');
  const copyButton = document.getElementById('copyButton');
  const downloadWinButton = document.getElementById('downloadWinButton');
  const downloadMacButton = document.getElementById('downloadMacButton');
  const optionalFields = ['prelogon-user', 'failClosed', 'log-file-path', 'enrollencryptiontoken','enforce-enroll-steering-profile-id', 'enforce-enroll-frequency', 'autoUpdate', 'device-tags'];
  function setFieldsEnabled(enabled) {
    allOtherFields.forEach(el => el.disabled = !enabled);
    updateEnforceEnrollmentFields();
  }

  function updateEnforceEnrollmentFields() {
    const userMode = document.getElementById('userMode').value;
    const enabled = tenantInput.value.trim().length > 0 && userMode.includes('idp');
    document.getElementById('enforce-enroll-steering-profile-id').disabled = !enabled;
    document.getElementById('enforce-enroll-frequency').disabled = !enabled;
  }

  const hasTenant = tenantInput.value.trim().length > 0;
  setFieldsEnabled(hasTenant);

  tenantInput.addEventListener('input', () => {
      const hasValue = tenantInput.value.trim().length > 0;
      setFieldsEnabled(hasValue);
      update();
  });

  const parameterMap = {
  tenant: val => {
      const mode = document.getElementById('userMode').value;
      return (mode.includes('idp') && val) ? `tenant=${val}` : '';
    },
  domain: val => {
      const mode = document.getElementById('userMode').value;
      return (mode.includes('idp') && val) ? `domain=${val}` : '';
    },
  token: val => val ? `token=${val}` : '',
  enrollauthtoken: val => {
      const mode = document.getElementById('userMode').value;
      return (!mode.includes('idp') && val) ? `enrollauthtoken=${val}` : '';
    },
  enrollencryptiontoken: val => val ? `enrollencryptiontoken=${val}` : '',
  'enforce-enroll-steering-profile-id': val => {
      const mode = document.getElementById('userMode').value;
      return (mode.includes('idp') && val) ? `enforceenrollsteeringprofileid=${val}` : '';
    },
  'enforce-enroll-frequency': val => {
      const mode = document.getElementById('userMode').value;
      const profileId = document.getElementById('enforce-enroll-steering-profile-id').value.trim();
      return mode.includes('idp') && profileId && val ? `enforceenrollfrequency=${val}` : '';
    },
  'prelogon-user': val => val ? `prelogonuser=${val}@prelogon.netskope.com` : '',
  failClosed: val => val ? `fail-close=${val}` : '',
  autoUpdate: val => val ? `autoupdate=${val}` : '',
  npavdimode: val => val ? 'npavdimode=on' : '',
  silentInstall: val => val ? '/qn' : '',
  'log-file-path': val => val ? `/l*v \"${val}\"` : '',
  'device-tags': val => val ? `INSTTAG=\"${val}\"` : '',
  userMode: val => ({
      'single-upn': '',
      'single-idp': ['installmode=IDP'],
      'multi-upn': ['mode=peruserconfig'],
      'multi-idp': ['mode=peruserconfig', 'installmode=IDP']
    }[val] || '')
  };
  function buildCommand() {
    let parts = [];
    let ending = [];
    const inputs = document.querySelectorAll('form input:not(.action-button), form select');
    inputs.forEach(el => {
      const id = el.id;
      let val = (el.type === 'checkbox') ? el.checked : el.value;
      if (parameterMap[id]) {
        const param = parameterMap[id](val);
        if (param) {
          if (id === "autoUpdate" || id === "silentInstall") {
            if (Array.isArray(param)) {
              ending.push(...param);
            } else {
            ending.push(param);
          }
        } else {
        if (Array.isArray(param)) {
          parts.push(...param);
        } else {
        parts.push(param);
      }
    }
  }
}
});
const tenant = document.getElementById('tenant').value;
const domain = document.getElementById('domain').value;
const userMode = document.getElementById('userMode').value;
const profileId = document.getElementById('enforce-enroll-steering-profile-id').value.trim();

if (tenant && domain && (!userMode.includes('idp') || profileId)) {
  const hostParam = `host=addon-${tenant}.${domain}`;
  parts.push(hostParam);
}

const msiexecCmd = `Example Windows Command:\nmsiexec /I NSClient.msi ${parts.join(' ')} ${ending.join(' ')}`.trim();
const rawParamsList = parts.concat(ending);
return `Netskope Client Installation Parameters:\n${rawParamsList.join('\n')}\n\n${msiexecCmd}`;
}
function highlightPendingFields() {
  const tenant = tenantInput.value.trim();
  const inputs = document.querySelectorAll('form input:not(#tenant), form select');
  inputs.forEach(el => {
    const userMode = document.getElementById('userMode').value;
    const isIdpMode = userMode.includes('idp');
    if (el.disabled || optionalFields.includes(el.id) || (isIdpMode && el.id === 'enrollauthtoken')) {
      el.classList.remove('pending-input');
      return;
    }
    let isEmpty = false;
    if (el.type === 'checkbox') {
      isEmpty = false;
    } else if (el.tagName === 'SELECT') {
    isEmpty = !el.value;
  } else {
  isEmpty = !el.value.trim();
}
if (tenant && isEmpty) {
  el.classList.add('pending-input');
} else {
el.classList.remove('pending-input');
}
});
}
function updateSwitchLabels() {
  const switchLabels = {
  silentInstall: ['Installer Hidden', 'Installer Visible'],
  npavdimode: ['Enabled', 'Disabled'],
  };
  Object.entries(switchLabels).forEach(([id, labels]) => {
    const checkbox = document.getElementById(id);
    const label = document.querySelector(`label[for="${id}"]`);
    if (checkbox && label) {
      label.textContent = checkbox.checked ? labels[0] : labels[1];
    }
  });
}
function update() {
  const tenant = tenantInput.value.trim();
  const domain = document.getElementById('domain').value;
  const userMode = document.getElementById('userMode').value;
  updateEnforceEnrollmentFields();
  const token = document.getElementById('token').value.trim();
  const enrollToken = document.getElementById('enrollauthtoken').value.trim();
  const tokenHelpText = document.getElementById('token-help-text');
  if (tenant) {
    tokenHelpText.innerHTML = `Find your tenant token information <a href="https://${tenant}.${domain}/ns#/settings?view=mdmDistribution" target="_blank">here</a>. An Encryption Token is almost always required.`;
    document.getElementById('enrollment-profile-help-text').innerHTML =
    `Find Enrollment Profile IDs <a href="https://${tenant}.${domain}/ns#/settings/steering-configuration?view=steering_config&subview=summary" target="_blank">here</a> when editing a Steering Configuration.`;
  } else {
  tokenHelpText.innerHTML = '';
  document.getElementById('enrollment-profile-help-text').innerHTML = '';
}
if (!tenant) {
  cmdOutput.textContent = 'To begin, enter your Netskope Tenant...';
  cmdOutput.classList.add("output-placeholder");
  outputContainer.style.display = "flex";
  copyButton.disabled = true;
  copyButton.style.display = "none";
  downloadWinButton.style.display = "none";
  downloadMacButton.style.display = "none";
  highlightPendingFields();
  return;
}
const isIdpMode = userMode.includes('idp');
let missing = [];
if (!userMode || !token || (!isIdpMode && !enrollToken)) {
  missing.push("Almost there! Please provide the following:");
}
if (!userMode) missing.push("- Select a Client Enrollment Mode");
if (!token) missing.push("- Organization ID Token");
if (!isIdpMode && !enrollToken) {
  missing.push("- Authentication Token");
}
if (missing.length > 0) {
  missing.push("");
  missing.push("IMPORTANT: You will likely need to configure an Encryption Token, depending on your Secure Enrollment configuration.");
  cmdOutput.textContent = missing.join("\n");
  cmdOutput.classList.add("output-placeholder");
  outputContainer.style.display = "flex";
  copyButton.disabled = true;
  copyButton.style.display = "none";
  downloadWinButton.style.display = "none";
  downloadMacButton.style.display = "none";
  highlightPendingFields();
  return;
}
const cmd = buildCommand();
cmdOutput.textContent = cmd;
cmdOutput.classList.remove("output-placeholder");
outputContainer.style.display = cmd ? "flex" : "none";
copyButton.disabled = !cmd;
copyButton.style.display = cmd ? "inline-block" : "none";
if (tenant && domain) {
  const downloadWinUrl = `https://download-${tenant}.${domain}/dlr/win/get`;
  const downloadMacUrl = `https://download-${tenant}.${domain}/dlr/mac/get`;
  downloadWinButton.href = downloadWinUrl;
  downloadMacButton.href = downloadMacUrl;
  downloadWinButton.style.display = cmd ? "inline-block" : "none";
  downloadMacButton.style.display = cmd ? "inline-block" : "none";
} else {
downloadWinButton.style.display = "none";
downloadMacButton.style.display = "none";
}
highlightPendingFields();
}
document.querySelectorAll('form input, form select').forEach(el => {
  el.addEventListener('input', update);
  el.addEventListener('change', update);
});
document.querySelectorAll('.form-check-input').forEach(el => {
    el.addEventListener('change', () => {
        el.dataset.changed = 'true';
        updateSwitchLabels();
        update();
    });
});
copyButton.addEventListener('click', () => {
  const cmd = cmdOutput.textContent;
  if (cmd && !cmdOutput.classList.contains("placeholder")) {
    navigator.clipboard.writeText(cmd);
  }
});
update();
updateSwitchLabels();

  document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
    new bootstrap.Tooltip(el, { container: 'body' });
  });
});
</script>
